name: Build Alisa Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate web source
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript and build scraper bundle
        run: |
          node --check web/app.js
          node --check web/engine.js
          node --check server/server.js
          node scripts/build-bundle.js 2 "Alisa Lite CI build"
          node --check server/public/bundle.js

      - name: Build Android APK
        run: gradle -p android assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alisa-lite-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
